name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Production dependencies only: the CMS editor (decap-cms) is a build-time dev dependency whose
      # transitive advisories are tracked separately and never ship to visitors.
      - run: npm audit --omit=dev --audit-level=high
