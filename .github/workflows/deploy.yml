# Deploys the v2 site to Cloudflare Workers (docs/DEPLOYMENT.md, docs/v2/06-TECH-SPEC.md §10).
#
# Before cutover (repository variable SITE_LIVE is not "true"):
#   a push to `v2` or a `v2-pr*` branch deploys a noindex review build to the Worker's workers.dev address only.
#   No custom domain is attached, so the live domain stays on Netlify.
# After cutover (SITE_LIVE = "true", set on cutover day in docs/DEPLOYMENT.md §4):
#   a push to `main`, the daily schedule (publishes future-dated Corporate School posts; replaces the Netlify build
#   hook) or a manual run deploys the production build. Pushes to v2 branches no longer deploy.
# The schedule and the manual button only exist once this file is on `main`, which happens at cutover.
name: Deploy
on:
  push:
    branches: [main, v2, "v2-pr*"]
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC = 06:00 WAT
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Review builds before cutover; production builds from main after it.
    if: >-
      (vars.SITE_LIVE != 'true' && github.ref_name != 'main') ||
      (vars.SITE_LIVE == 'true' && github.ref_name == 'main')
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SITE_ENV: ${{ vars.SITE_LIVE == 'true' && 'production' || 'preview' }}
      NEXT_PUBLIC_SHOW_CLIENT_PLACEHOLDERS: ${{ vars.SITE_LIVE == 'true' && '' || 'true' }}
      NEXT_PUBLIC_ENABLE_PORTAL_PROTOTYPE: ${{ vars.SITE_LIVE == 'true' && '' || 'true' }}
      # Turnstile site key "SCS forms" (public; owner checklist step 6). A repository variable can override it.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY || '0x4AAAAAAFyc6LyJDNgcCfFV' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # On failure, the last lines of the build output become an error annotation on the run, which is readable
      # without signing in to GitHub (the full log is not).
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log || {
            echo "::error title=Build failed::$(tail -n 30 build.log | sed 's/[[:cntrl:]]//g' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
      - run: npm run check:site
      - name: Deploy the Worker
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID first (owner checklist steps 4-5)."; exit 1
          fi
          # As in Build: on failure, the end of the output becomes a run annotation.
          note() { echo "::error title=$1::$(tail -n 30 "$2" | sed 's/[[:cntrl:]]//g' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; }
          npx wrangler d1 migrations apply DB --remote 2>&1 | tee migrate.log || { note "Migrations failed" migrate.log; exit 1; }
          npx wrangler deploy --message "${NEXT_PUBLIC_SITE_ENV} ${GITHUB_REF_NAME} ${GITHUB_SHA::7}" 2>&1 | tee deploy.log ||
            { note "Deploy failed" deploy.log; exit 1; }
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          [ -n "$url" ] && echo "::notice title=Review address::$url"
          {
            echo "## Deployed (${NEXT_PUBLIC_SITE_ENV})"
            echo ""
            echo "- Branch \`${GITHUB_REF_NAME}\`, commit \`${GITHUB_SHA::7}\`"
            [ -n "$url" ] && echo "- Review address: $url"
            echo "- Roll back: Cloudflare → Workers & Pages → scs-website → Deployments, or \`npx wrangler rollback\` (docs/DEPLOYMENT.md §5)"
          } >> "$GITHUB_STEP_SUMMARY"
