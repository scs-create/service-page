# v2 build (docs/v2/06-TECH-SPEC.md §10): every PR into v2 is checked, built and uploaded as a Cloudflare preview
# version. Nothing here deploys to production; `wrangler deploy` is added only after the owner approves cutover.
name: v2
on:
  pull_request:
    branches: [v2]
  push:
    branches: [v2]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_ENV: preview
      NEXT_PUBLIC_SHOW_CLIENT_PLACEHOLDERS: "true"
      NEXT_PUBLIC_ENABLE_PORTAL_PROTOTYPE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Production dependencies only: decap-cms is a build-time dev dependency whose transitive advisories never ship.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      # Banned words, legal-word report, [OWNER TO CONFIRM], old phone, Benhen, redirect targets.
      - run: npm run check:site

      - name: Upload preview version
        id: preview
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set yet (owner checklist steps 4-5): skipping the preview upload."
            exit 0
          fi
          npx wrangler versions upload --preview-alias "pr-${{ github.event.number }}" --message "PR #${{ github.event.number }} ${GITHUB_SHA::7}" | tee wrangler.log
          url=$(grep -oE 'https://pr-[0-9]+-[a-z0-9.-]+\.workers\.dev' wrangler.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: steps.preview.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- v2-preview -->";
            const body = `${marker}\nPreview: ${{ steps.preview.outputs.url }} (commit ${context.sha.slice(0, 7)})`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
