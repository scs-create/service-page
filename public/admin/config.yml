backend:
  name: github
  repo: scs-create/service-page
  branch: main
  # GitHub sign-in runs on this site's own Worker (worker/oauth.ts), not Netlify. The popup opens /api/auth.
  base_url: https://stephencorporateservices-scs.com
  auth_endpoint: api/auth
# Editors open /admin (behind Cloudflare Access), sign in with GitHub, and edits are committed to the repository;
# each commit triggers the deploy workflow, which rebuilds the site.
publish_mode: editorial_workflow

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "corporate_school"
    label: "Corporate School (Blog)"
    folder: "src/content/corporate-school"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Services", "Corporate World Updates", "Corporate Learning"]
      - label: "Key takeaways (3 to 5 short sentences, shown at the top)"
        name: "takeaways"
        widget: "list"
        required: false
        field: { label: "Takeaway", name: "item", widget: "string" }
      - label: "Related services (shown in 'How SCS can help')"
        name: "services"
        widget: "relation"
        collection: "services"
        value_field: "slug"
        search_fields: ["title"]
        display_fields: ["title"]
        multiple: true
        max: 4
        required: false
      - { label: "How SCS can help (one or two sentences)", name: "help", widget: "text", required: false }
      - label: "Free tool link"
        name: "tool"
        widget: "object"
        required: false
        fields:
          - label: "Tool"
            name: "href"
            widget: "select"
            options:
              - { label: "Assess your Business", value: "/assess" }
              - { label: "Compliance Starter Checklist", value: "/compliance-checklist" }
              - { label: "Business Structure Chooser", value: "/business-structure" }
              - { label: "Find My Service", value: "/find-my-service" }
              - { label: "Compliance Calendar", value: "/compliance-calendar" }
          - { label: "Button text", name: "label", widget: "string" }
      - { label: "Last reviewed", name: "reviewed", widget: "datetime", required: false, hint: "Leave empty to use the publish date." }
      - label: "Official sources (shown with the date each was retrieved)"
        name: "sources"
        widget: "list"
        required: false
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Address (https://...)", name: "url", widget: "string" }
          - { label: "Retrieved on", name: "retrieved", widget: "datetime", time_format: false }
      - { label: "Body", name: "body", widget: "markdown" }

  # v2 services: the page copy for each of the 66 services. Names, clusters and paths come from the catalogue
  # (src/content/v2/services.v2.json), which is edited in the repository, not here. No fees and no delivery times.
  - name: "services_v2"
    label: "Services (v2 page copy)"
    folder: "src/content/v2/services"
    create: false
    delete: false
    extension: "json"
    format: "json"
    identifier_field: "id"
    slug: "{{id}}"
    summary: "{{id}} · {{status}}"
    fields:
      - { label: "Service ID", name: "id", widget: "string", hint: "Do not change." }
      - label: "Status"
        name: "status"
        widget: "select"
        options: [{ label: "Draft (awaiting approval)", value: "draft" }, { label: "Approved", value: "approved" }]
      - { label: "Who it is for", name: "whoFor", widget: "text" }
      - label: "Why it matters (exactly 3)"
        name: "benefits"
        widget: "list"
        min: 3
        max: 3
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Text", name: "text", widget: "string" }
      - { label: "What you receive", name: "whatYouReceive", widget: "list", field: { label: "Item", name: "item", widget: "string" } }
      - { label: "What you provide", name: "whatYouProvide", widget: "list", field: { label: "Item", name: "item", widget: "string" } }
      - { label: "What this service does not include", name: "doesNotInclude", widget: "list", field: { label: "Item", name: "item", widget: "string" } }
      - label: "v1 service lines (kept by owner decision; SA-11, CS-07, CR-07, FA-08 and HO-09 only)"
        name: "v1Retained"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "Framing sentence", name: "framing", widget: "text" }
          - { label: "Intro line", name: "intro", widget: "string" }
          - { label: "Lines", name: "lines", widget: "list", field: { label: "Line", name: "item", widget: "string" } }
          - { label: "Closing", name: "closing", widget: "text", required: false }

  - name: "service_areas_v2"
    label: "Service areas (v2 introductions)"
    files:
      - name: "clusters"
        label: "Cluster introductions"
        file: "src/content/v2/clusters.json"
        fields:
          - { label: "Note", name: "note", widget: "hidden" }
          - label: "Clusters"
            name: "clusters"
            widget: "object"
            fields:
              - { label: "Strategy & Advisory", name: "strategy-and-advisory", widget: "object", fields: [{ label: "Status", name: "status", widget: "select", options: ["draft", "approved"] }, { label: "What this covers", name: "covers", widget: "text" }] }
              - { label: "Company Formation & Secretarial", name: "company-formation-and-secretarial", widget: "object", fields: [{ label: "Status", name: "status", widget: "select", options: ["draft", "approved"] }, { label: "What this covers", name: "covers", widget: "text" }] }
              - { label: "Compliance & Regulatory", name: "compliance-and-regulatory", widget: "object", fields: [{ label: "Status", name: "status", widget: "select", options: ["draft", "approved"] }, { label: "What this covers", name: "covers", widget: "text" }] }
              - { label: "Finance & Accounting", name: "finance-and-accounting", widget: "object", fields: [{ label: "Status", name: "status", widget: "select", options: ["draft", "approved"] }, { label: "What this covers", name: "covers", widget: "text" }] }
              - { label: "HR & Operations", name: "hr-and-operations", widget: "object", fields: [{ label: "Status", name: "status", widget: "select", options: ["draft", "approved"] }, { label: "What this covers", name: "covers", widget: "text" }] }
              - { label: "Technology & Digital", name: "technology-and-digital", widget: "object", fields: [{ label: "Status", name: "status", widget: "select", options: ["draft", "approved"] }, { label: "What this covers", name: "covers", widget: "text" }] }
              - { label: "Marketing & Communications", name: "marketing-and-communications", widget: "object", fields: [{ label: "Status", name: "status", widget: "select", options: ["draft", "approved"] }, { label: "What this covers", name: "covers", widget: "text" }] }

  - name: "services"
    label: "v1 service categories (reference: kept service lines and old links)"
    folder: "src/content/services/entries"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Title", name: "title", widget: "string" }
      - label: "Cluster"
        name: "cluster"
        widget: "select"
        options:
          - { label: "Start & Structure", value: "start-and-structure" }
          - { label: "Compliance & Regulatory", value: "compliance-and-regulatory" }
          - { label: "Finance & Tax", value: "finance-and-tax" }
          - { label: "People & Operations", value: "people-and-operations" }
          - { label: "Technology & Data", value: "technology-and-data" }
          - { label: "Growth & Market Presence", value: "growth-and-market-presence" }
      - { label: "Framing Sentence", name: "framingSentence", widget: "text" }
      - { label: "Intro Line", name: "introLine", widget: "string" }
      - label: "Services List"
        name: "services"
        widget: "list"
        field: { label: "Service", name: "item", widget: "string" }
      - { label: "Supporting Statement", name: "supportingStatement", widget: "text", required: false }
      - { label: "Closing Statement", name: "closingStatement", widget: "text", required: false }

  - name: "academy_topics"
    label: "Academy Training Topics"
    files:
      - name: "topics"
        label: "Training Topics List"
        file: "src/content/academy/topics-cms.json"
        fields:
          - label: "Topics"
            name: "topics"
            widget: "list"
            field: { label: "Topic", name: "item", widget: "string" }

  - name: "portfolio"
    label: "Portfolio Case Studies"
    folder: "src/content/portfolio/entries"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    identifier_field: "client"
    fields:
      - { label: "Display order (1 = first)", name: "order", widget: "number", value_type: "int" }
      - { label: "Slug (lowercase-with-dashes)", name: "slug", widget: "string" }
      - { label: "Client", name: "client", widget: "string" }
      - { label: "CAC number (digits only; leave empty until known)", name: "rc", widget: "string", required: false }
      - { label: "Number type", name: "regType", widget: "select", options: ["RC", "BN"], default: "RC", required: false, hint: "RC for companies, BN for business names" }
      - { label: "Sector (shown on the card)", name: "sector", widget: "string" }
      - label: "Filter category"
        name: "filter"
        widget: "select"
        options:
          - { label: "Healthcare & Pharma", value: "healthcare-pharma" }
          - { label: "Real Estate & Construction", value: "real-estate" }
          - { label: "Tech & Digital", value: "tech-digital" }
          - { label: "Logistics & Transport", value: "logistics-transport" }
          - { label: "Hospitality", value: "hospitality" }
          - { label: "Agribusiness", value: "agribusiness" }
          - { label: "Non-Profit", value: "non-profit" }
          - { label: "Manufacturing", value: "manufacturing" }
          - { label: "Media, Retail & Professional", value: "media-retail-professional" }
          - { label: "Finance & Investment", value: "finance-investment" }
          - { label: "Education", value: "education" }
      - { label: "Show on Home page", name: "featured", widget: "boolean", default: false }
      - { label: "Headline", name: "headline", widget: "string" }
      - { label: "The Challenge", name: "challenge", widget: "text" }
      - label: "What SCS Delivered"
        name: "delivered"
        widget: "list"
        field: { label: "Item", name: "item", widget: "string" }
      - { label: "Business Impact", name: "impact", widget: "text" }
      - label: "Services Provided (use exact names, e.g. Company Formation)"
        name: "serviceLines"
        widget: "list"
        field: { label: "Service line", name: "item", widget: "string" }

  - name: "verification_documents"
    label: "Verification Documents (Trust Hub)"
    folder: "src/content/verification/documents"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    media_folder: "/public/verification"
    public_folder: "/verification"
    fields:
      - { label: "Slug (lowercase-with-dashes)", name: "slug", widget: "string" }
      - { label: "Title", name: "title", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Certificate of Incorporation", "Regulatory Permit", "Client Acknowledgment Letter"]
      - { label: "Client", name: "client", widget: "string", required: false }
      - { label: "Issuing body (e.g. Corporate Affairs Commission)", name: "issuingBody", widget: "string", required: false }
      - { label: "Badge text (e.g. Verifiable on CAC public search)", name: "badge", widget: "string", required: false }
      - { label: "Issued", name: "issued", widget: "string", required: false }
      - { label: "Image (watermark it before uploading)", name: "image", widget: "image" }
      - { label: "Image description (alt text)", name: "alt", widget: "string" }

  # ---------- Added in this release (all validated at build time by src/lib/schemas.ts) ----------
  - name: "packages"
    label: "Managed Support Packages (A–F)"
    folder: "src/content/packages/entries"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "name"
    fields:
      - { label: "Letter (A–Z)", name: "id", widget: "string" }
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Who it is for", name: "audience", widget: "string" }
      - { label: "What is included", name: "includes", widget: "text" }

  - name: "industries"
    label: "Industries (needs and agencies)"
    folder: "src/content/industries/entries"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "name"
    fields:
      - { label: "Slug (lowercase-with-dashes)", name: "slug", widget: "string" }
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Typical needs", name: "needs", widget: "list", field: { label: "Need", name: "item", widget: "string" } }
      - { label: "Agency codes (see Regulators list, e.g. CAC, NRS)", name: "regulators", widget: "list", field: { label: "Code", name: "item", widget: "string" } }
      - { label: "Related service slugs", name: "services", widget: "list", required: false, field: { label: "Service slug", name: "item", widget: "string" } }
      - { label: "Note", name: "note", widget: "text", required: false }

  - name: "faqs"
    label: "FAQ"
    folder: "src/content/faqs/entries"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "question"
    fields:
      - { label: "Order (1 = first)", name: "order", widget: "number", value_type: "int" }
      - { label: "Question", name: "question", widget: "string" }
      - { label: "Answer", name: "answer", widget: "text" }

  - name: "ip_showcase"
    label: "IP Showcase (hidden until permission = on)"
    folder: "src/content/ip/entries"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "name"
    fields:
      - { label: "Slug (lowercase-with-dashes)", name: "slug", widget: "string" }
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Type", name: "type", widget: "select", options: ["Trademark", "Patent", "Copyright"] }
      - { label: "Client has given permission to show this publicly", name: "permission", widget: "boolean", default: false }
      - { label: "Status note (filed vs registered — confirm before showing)", name: "status", widget: "string" }
      - { label: "Note", name: "note", widget: "string", required: false }

  - name: "testimonials"
    label: "Testimonials (consent required)"
    folder: "src/content/testimonials/entries"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "name"
    fields:
      - { label: "Quote", name: "quote", widget: "text" }
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Role", name: "role", widget: "string", required: false }
      - { label: "Organisation", name: "organisation", widget: "string", required: false }
      - { label: "The person gave documented consent to publish this", name: "consent", widget: "boolean", default: false }

  - name: "programmes"
    label: "Signature Programmes (problem → solution)"
    folder: "src/content/programmes/entries"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    fields:
      - { label: "Order (1 = first)", name: "order", widget: "number", value_type: "int" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "The problem", name: "problem", widget: "text" }
      - { label: "The solution", name: "solution", widget: "text" }
      - { label: "Related service slugs", name: "services", widget: "list", required: false, field: { label: "Service slug", name: "item", widget: "string" } }

  - name: "site_content"
    label: "Site content (single files)"
    files:
      - name: "partnership"
        label: "Partnership & Quarterly Business Check-Up"
        file: "src/content/partnership.json"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Formerly called", name: "formerlyCalled", widget: "string" }
          - { label: "Intro", name: "intro", widget: "text" }
          - { label: "Check-Up name", name: "checkupName", widget: "string" }
          - { label: "Check-Up description", name: "checkupDescription", widget: "text" }
          - { label: "Report name", name: "reportName", widget: "string" }
          - { label: "Visitor assessment note", name: "visitorAssessmentNote", widget: "text" }
          - { label: "Terms (leave the [CLIENT TO CONFIRM] text until terms are agreed)", name: "terms", widget: "string" }
      - name: "regulators"
        label: "Regulators (codes used by industries and tools)"
        file: "src/content/regulators.json"
        fields:
          - label: "Regulators"
            name: "regulators"
            widget: "list"
            fields:
              - { label: "Code", name: "code", widget: "string" }
              - { label: "Full name", name: "name", widget: "string" }
      - name: "calendar"
        label: "Compliance Calendar areas"
        file: "src/content/tools/calendar.json"
        fields:
          - { label: "Intro", name: "intro", widget: "text" }
          - label: "Areas"
            name: "areas"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Agency codes", name: "regulators", widget: "list", field: { label: "Code", name: "item", widget: "string" } }
              - { label: "Note", name: "note", widget: "text" }
          - { label: "Disclaimer", name: "disclaimer", widget: "text" }

# AUTH: GitHub backend with this site's own OAuth endpoints (/api/auth, /api/callback on the Worker, using the GitHub
# OAuth App from owner checklist step 12). Editors sign in with a GitHub account that has write access to the
# repository; /admin itself is behind Cloudflare Access (step 11).
