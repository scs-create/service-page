[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Preview / branch deploys show client placeholders and the portal prototype.
# Production does NOT (set the same variables in the production context only if you want them visible there).
[context.deploy-preview.environment]
  NEXT_PUBLIC_SHOW_CLIENT_PLACEHOLDERS = "true"
  NEXT_PUBLIC_ENABLE_PORTAL_PROTOTYPE = "true"
[context.branch-deploy.environment]
  NEXT_PUBLIC_SHOW_CLIENT_PLACEHOLDERS = "true"
  NEXT_PUBLIC_ENABLE_PORTAL_PROTOTYPE = "true"

# Security headers.
# CSP here is the minimal policy that applies to EVERY path, including /admin (Decap CMS + GitHub OAuth via
# api.netlify.com). The full policy for the public site (default-src 'self') is set in
# next.config.ts for every path except /admin. See README → Security notes.
# HSTS: max-age only. includeSubDomains / preload are NOT enabled until every subdomain (www, mail/Workspace
# records, any future subdomain) is confirmed HTTPS-only; preload is effectively irreversible.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# "Academy" is now "Corporate College". Netlify answers these with a true 301 before Next.js runs
# (next.config.ts keeps the same rule as a fallback, which Next.js serves as 308).
[[redirects]]
  from = "/academy"
  to = "/corporate-college"
  status = 301
  force = true

[[redirects]]
  from = "/academy/*"
  to = "/corporate-college/:splat"
  status = 301
  force = true
